name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin repository
        run: python3 scripts/validate.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate Claude Code marketplace
        run: >-
          npx --yes --package @anthropic-ai/claude-code@2.1.222 --
          claude plugin validate . --strict
      - name: Validate Claude Code plugin
        run: >-
          npx --yes --package @anthropic-ai/claude-code@2.1.222 --
          claude plugin validate plugins/developing-ai-agents --strict
